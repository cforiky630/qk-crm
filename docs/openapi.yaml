                $ref: '#/components/schemas/ResultClue'

  /businesses:
    get:
      tags: [商机管理]
      summary: 商机列表查询
      description: |
        默认只返回仍在跟进的商机：`status` 为 `4 回收` 与 `5 转客户` 的商机不出现在此列表。
        显式传 `status` 时按其取值筛选（前端状态下拉里包含这两个状态，选中后应能看到对应数据）。
        按修改时间倒序。
