      description: |
        新增的商机一律置为 `1 待分配` 且归属人清空，请求体中的 `status`、`userId` 不生效。
        手机号唯一，重复时返回 `msg = 该手机号已录入商机`。该接口会写入一条操作日志。
      operationId: addBusiness
      requestBody:
        required: true
        content:
