openapi: 3.1.0

info:
  title: QK 教培 CRM 管理系统 API
  version: 1.1.12
  summary: 线索、商机、客户全流程管理接口
  description: |
    面向教培行业销售团队的后台管理接口，覆盖线索录入、分配、跟进、转商机、再分配、
    再跟进、转客户的全流程，以及部门、角色、用户、课程、活动等基础数据维护。

    ## 通用约定

    ### 统一响应结构
    所有接口返回 `Result` 对象：`code` 为 `1` 表示成功、`0` 表示失败。
    **业务失败同样返回 HTTP 200**，由调用方依据 `code` 判断；`msg` 为可直接展示给用户的中文提示。
    无业务数据时 `data` 为 `null`，且该字段会**整个省略**（服务端 `Result` 标注 `@JsonInclude(NON_NULL)`），
    判断成功请用 `code == 1`，不要依赖 `data` 字段是否存在。

    ### 认证
    除 `POST /login` 外，所有接口都要求在请求头 `token` 中携带登录接口签发的 JWT 令牌。
    令牌缺失、被篡改或已过期时，接口直接返回 **HTTP 401 且响应体为空**，不返回 `Result` 结构。
    令牌默认有效期 24 小时。

    ### 分页
    分页接口的查询参数为 `page`（页码，从 1 开始，默认 1）与 `pageSize`（每页条数，默认 10，**单页最大 200**），
    响应数据统一为 `{ "total": 总记录数, "rows": [...] }`。

    ### 错误语义（HTTP 状态码）
    | 状态码 | 触发场景 | 响应体 |
    | --- | --- | --- |
    | `200` | 成功；以及**业务失败**（数据不存在、唯一键冲突、文件类型不合法、状态不允许等） | `Result`，失败时 `code = 0`，按 `msg` 提示 |
    | `400` | 请求体不是合法 JSON、日期格式不合法、路径参数类型不匹配、上传文件超过大小限制 | `Result`，`code = 0`，`msg` 形如「请求参数格式不正确」 |
    | `401` | 未携带 `token`、令牌被篡改或已过期 | 空响应体 |
    | `500` | 服务端异常（代码缺陷） | `Result`，`code = 0`，`msg` 为「系统繁忙,请稍后重试」，堆栈只进服务端日志 |

    ### 时间格式
    输出默认固定为 `yyyy-MM-dd HH:mm:ss`；输入额外兼容 `yyyy-MM-dd HH:mm`、`yyyy-MM-dd`
    （按当天 00:00:00 处理）与 ISO 格式 `yyyy-MM-ddTHH:mm:ss`。
    `createTime`、`updateTime` 由服务端自动填充为服务器时间，请求中传入的值会被忽略。

    ### 主键与数据不存在
    新增接口的 `id` 由数据库自增生成，请求体中传入的 `id` 会被服务端忽略；
    修改、删除接口操作不存在的数据时返回 `code = 0`，`msg` 形如「用户不存在」「线索不存在」。

    ### 字段可空性
    响应模型中标注为 `null` 联合类型的字段在数据库中可为 NULL，未赋值时返回 `null`。

    ### 唯一性约束
    用户名、手机号、邮箱、角色标识、部门名称，以及线索/商机/客户的手机号均受唯一索引保护。
    冲突时返回 `code = 0`，`msg` 为「用户名已存在」「该手机号已录入线索」等具体提示。

    ### 删除接口的前置校验
    删除是**逻辑删除**：记录从接口视角消失（列表、详情、下拉、统计都不再出现），但库中保留，误删可由 DBA 恢复；
    已删除记录占用的唯一值（用户名、手机号、邮箱、部门名、角色标识）会被释放，因此同一个值可以重新创建。
    项目不使用物理外键，关联完整性由 Service 层保证，因此删除接口在下列情况会返回 `code = 0`：

    | 接口 | 拒绝条件 | msg 示例 |
    | --- | --- | --- |
    | `DELETE /depts/{id}` | 部门处于启用状态（`status = 1`） | `部门处于启用状态，请先停用后再删除` |
    | `DELETE /depts/{id}` | 部门下仍有关联用户 | `该部门下还有 3 名用户，无法删除` |
    | `DELETE /roles/{id}` | 角色下仍有关联用户 | `该角色下还有 2 名用户，无法删除` |
    | `DELETE /courses/{id}` | 课程仍被商机或客户引用 | `该课程已被 1 条商机、2 条客户引用，无法删除` |
    | `DELETE /activities/{id}` | 活动仍被线索引用 | `该活动已关联 5 条线索，无法删除` |
    | `DELETE /users/{ids}` | 包含当前登录用户 | `不能删除当前登录用户` |
    | `DELETE /users/{ids}` | 包含不存在的用户 | `用户不存在: [99999999]` |
    | `DELETE /users/{ids}` | 用户仍被线索、商机或跟进记录引用 | `用户 12 仍被业务数据引用（线索 1 条、商机 0 条、跟进记录 2 条），无法删除；如不再使用请改为停用` |

    此类数据如不再使用，应改为**停用**（`status = 0`）而不是删除。

servers:
  - url: /
    description: 当前服务。未配置 server.port，本地启动时监听 http://localhost:8080

security:
  - token: []

tags:
  - name: 认证
    description: 登录与令牌签发
  - name: 用户管理
    description: 用户增删改查、下拉列表、按角色或部门筛选
  - name: 部门管理
    description: 部门增删改查与下拉列表
  - name: 角色管理
    description: 角色增删改查与下拉列表
  - name: 课程管理
    description: 课程增删改查、按学科筛选
  - name: 活动管理
    description: 活动增删改查、按渠道或类型筛选
  - name: 线索管理
    description: 线索列表、线索池、跟进、分配、伪线索与转商机
  - name: 商机管理
    description: 商机列表、公海池、跟进、分配、回收与转客户
  - name: 客户管理
    description: 客户列表、详情、新增与修改
  - name: 操作日志
    description: 由 AOP 切面自动记录的增删改操作日志
  - name: 数据统计
    description: 首页数据概览
  - name: 文件上传
    description: 图片上传至阿里云 OSS

paths:
  /login:
    post:
      tags: [认证]
      summary: 用户登录
      description: 校验账号密码并签发 JWT 令牌。用户名或密码错误、或用户已被停用时返回 `code = 0`。
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginDto'
            example:
              username: zhangsan
              password: '123'
      responses:
        '200':
          description: 登录成功返回用户信息与令牌；失败时 `code = 0`、`msg = 用户名或密码错误`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultLogin'

  /users:
    get:
      tags: [用户管理]
      summary: 条件分页查询用户列表
      operationId: listUsers
      parameters:
        - name: name
          in: query
          description: 姓名，模糊匹配
          schema: { type: string }
        - name: status
          in: query
          description: 状态，1:正常, 0:停用
          schema: { type: integer, format: int32, enum: [0, 1] }
        - name: phone
          in: query
          description: 手机号，模糊匹配
          schema: { type: string }
        - name: deptId
          in: query
          description: 部门ID，精确匹配
          schema: { type: integer, format: int64 }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，按最后修改时间倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserPage'
    post:
      tags: [用户管理]
      summary: 新增用户
      description: |
        请求体不包含密码时，使用默认密码 `123`；包含密码时按 `md5(用户名 + 明文密码)` 存储。
        该接口会写入一条操作日志。
      operationId: addUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBody'
            example:
              username: lisi
              name: 李四
              phone: '13800138002'
              email: lisi@example.com
              gender: 1
              status: 1
              deptId: 4
              roleId: 2
              remark: 内容编辑
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [用户管理]
      summary: 修改用户信息
      description: |
        请求体中的 `password` 会被服务端忽略并置空，密码修改需走单独的重置流程。
        该接口会写入一条操作日志。
      operationId: updateUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /users/list:
    get:
      tags: [用户管理]
      summary: 查询所有用户（下拉框）
      operationId: listAllUsers
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 全量用户列表，按ID升序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserList'

  /users/role/{roleLabel}:
    get:
      tags: [用户管理]
      summary: 根据角色标识查询用户
      operationId: listUsersByRole
      parameters:
        - name: roleLabel
          in: path
          required: true
          description: 角色标识，如 `clue_operator`、`business_operator`
          schema: { type: string }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 用户列表，**只返回正常状态（`status = 1`）的用户**（分配线索/商机的人员下拉数据源，停用账号不可被分配）；角色标识不存在时返回空数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserList'

  /users/dept/{deptId}:
    get:
      tags: [用户管理]
      summary: 根据部门ID查询用户
      operationId: listUsersByDept
      parameters:
        - name: deptId
          in: path
          required: true
          schema: { type: integer, format: int64 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 用户列表，部门下无用户时返回空数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserList'

  /users/{ids}:
    get:
      tags: [用户管理]
      summary: 根据ID查询用户（回显）
      description: 路径参数为单个用户ID。
      operationId: getUserById
      parameters:
        - $ref: '#/components/parameters/UserIds'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 用户信息；不存在时 `code = 0`、`msg = 用户不存在`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUser'
    delete:
      tags: [用户管理]
      summary: 批量删除用户
      description: 支持单个与批量删除，路径参数可传多个ID。该接口会写入一条操作日志。
      operationId: deleteUsers
      parameters:
        - $ref: '#/components/parameters/UserIds'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /depts:
    get:
      tags: [部门管理]
      summary: 条件分页查询部门
      operationId: listDepts
      parameters:
        - name: name
          in: query
          description: 部门名称，模糊匹配
          schema: { type: string }
        - name: status
          in: query
          description: 状态，1:正常, 0:停用
          schema: { type: integer, format: int32, enum: [0, 1] }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，按最后修改时间倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDeptPage'
    post:
      tags: [部门管理]
      summary: 新增部门
      description: 部门名称唯一，重复时返回 `msg = 部门名称已存在`。该接口会写入一条操作日志。
      operationId: addDept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [部门管理]
      summary: 修改部门
      description: 该接口会写入一条操作日志。
      operationId: updateDept
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeptBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /depts/list:
    get:
      tags: [部门管理]
      summary: 查询所有正常状态的部门（下拉框）
      operationId: listAllDepts
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 仅返回 `status = 1` 的部门，按ID升序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDeptList'

  /depts/{id}:
    get:
      tags: [部门管理]
      summary: 根据ID查询部门
      operationId: getDeptById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 部门信息；不存在时 `code = 0`、`msg = 部门不存在`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultDept'
    delete:
      tags: [部门管理]
      summary: 删除部门
      description: 该接口会写入一条操作日志。
      operationId: deleteDept
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /roles:
    get:
      tags: [角色管理]
      summary: 条件分页查询角色
      operationId: listRoles
      parameters:
        - name: name
          in: query
          description: 角色名称，模糊匹配
          schema: { type: string }
        - name: label
          in: query
          description: 角色标识，模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，按最后修改时间倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRolePage'
    post:
      tags: [角色管理]
      summary: 新增角色
      description: 角色标识全局唯一，重复时返回 `msg = 角色标识已存在`。该接口会写入一条操作日志。
      operationId: addRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [角色管理]
      summary: 修改角色
      description: 该接口会写入一条操作日志。
      operationId: updateRole
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /roles/list:
    get:
      tags: [角色管理]
      summary: 查询所有角色（下拉框）
      operationId: listAllRoles
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 全量角色列表，按ID升序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRoleList'

  /roles/{id}:
    get:
      tags: [角色管理]
      summary: 根据ID查询角色
      operationId: getRoleById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 角色信息；不存在时 `code = 0`、`msg = 角色不存在`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultRole'
    delete:
      tags: [角色管理]
      summary: 删除角色
      description: 该接口会写入一条操作日志。
      operationId: deleteRole
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /courses:
    get:
      tags: [课程管理]
      summary: 条件分页查询课程
      operationId: listCourses
      parameters:
        - name: name
          in: query
          description: 课程名称，模糊匹配
          schema: { type: string }
        - name: subject
          in: query
          description: 学科
          schema: { $ref: '#/components/schemas/Subject' }
        - name: target
          in: query
          description: 适用人群
          schema: { $ref: '#/components/schemas/CourseTarget' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，按更新时间倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCoursePage'
    post:
      tags: [课程管理]
      summary: 新增课程
      description: 该接口会写入一条操作日志。
      operationId: addCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [课程管理]
      summary: 修改课程
      description: 该接口会写入一条操作日志。
      operationId: updateCourse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CourseBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /courses/list:
    get:
      tags: [课程管理]
      summary: 查询所有课程（下拉框）
      operationId: listAllCourses
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 全量课程列表，按ID升序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCourseList'

  /courses/subject/{subject}:
    get:
      tags: [课程管理]
      summary: 根据学科查询课程
      operationId: listCoursesBySubject
      parameters:
        - name: subject
          in: path
          required: true
          description: 学科
          schema: { $ref: '#/components/schemas/Subject' }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 课程列表，无匹配时返回空数组
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCourseList'

  /courses/{id}:
    get:
      tags: [课程管理]
      summary: 根据ID查询课程
      operationId: getCourseById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 课程信息；不存在时 `code = 0`、`msg = 课程不存在`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCourse'
    delete:
      tags: [课程管理]
      summary: 删除课程
      description: 该接口会写入一条操作日志。
      operationId: deleteCourse
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /activities:
    get:
      tags: [活动管理]
      summary: 条件分页查询活动
      operationId: listActivities
      parameters:
        - name: channel
          in: query
          description: 渠道来源
          schema: { $ref: '#/components/schemas/Channel' }
        - name: type
          in: query
          description: 活动类型
          schema: { $ref: '#/components/schemas/ActivityType' }
        - name: activityStatus
          in: query
          description: 活动状态，1 未开始 / 2 进行中 / 3 已结束；不传表示不筛选
          schema: { $ref: '#/components/schemas/ActivityStatus' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，按更新时间倒序
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultActivityPage'
    post:
      tags: [活动管理]
      summary: 新增活动
      description: 该接口会写入一条操作日志。
      operationId: addActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityBody'
            example:
              channel: 1
              name: 暑期 Java 就业班折扣
              startTime: '2025-06-01 00:00:00'
              endTime: '2025-06-30 23:59:59'
              description: 暑期报名享 8 折
              type: 1
              discount: 8.0
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [活动管理]
      summary: 修改活动
      description: 该接口会写入一条操作日志。
      operationId: updateActivity
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActivityBody'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

