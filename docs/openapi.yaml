        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: |
            线索详细信息，`trackRecords` 为该线索的全部跟进记录（按创建时间倒序），
            每条记录带出跟进人姓名。线索不存在时 `code = 0`、`msg = 线索不存在`。
