      summary: 上传图片到阿里云 OSS
      description: |
        对象按 `images/{上传人ID}/yyyy/MM/dd/{uuid}{后缀}` 命名（按用户隔离，便于后续追溯与清理），返回可公开访问的 URL。
        只接受 jpg、jpeg、png、gif、bmp、webp 六种后缀；其他后缀返回 `code = 0`，
        `msg` 为「只支持 jpg、jpeg、png、gif、bmp、webp 格式的图片」。
        单个文件最大 5MB、整个请求最大 6MB，超出时返回 HTTP 400 且 `msg` 为「上传文件过大」。
      operationId: uploadImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                image:
                  type: string
                  format: binary
                  description: 待上传的图片文件
              required: [image]
      responses:
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 上传成功，`data` 为图片访问 URL
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUrl'

components:

  securitySchemes:
    token:
      type: apiKey
      in: header
      name: token
      description: |
        登录接口返回的 JWT 令牌。缺失、被篡改或已过期时接口返回 HTTP 401 且响应体为空。

  parameters:
    Id:
      name: id
      in: path
      required: true
      description: 主键ID，64 位整型（对应数据库 bigint unsigned）
      schema: { type: integer, format: int64 }
    UserIds:
      name: ids
      in: path
      required: true
      description: |
        用户ID。查询回显时传单个ID，如 `5`；批量删除时可传多个ID，用英文逗号分隔，如 `1,2,3`。
      schema: { type: string }
      example: '1,2,3'
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema: { type: integer, format: int32, minimum: 1, default: 1 }
    PageSize:
      name: pageSize
      in: query
      description: 每页记录数
      schema: { type: integer, format: int32, minimum: 1, default: 10 }

  responses:
    Ok:
      description: 操作成功，`code = 1`、`data` 为 `null`
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'
    Unauthorized:
      description: 令牌缺失、被篡改或已过期。响应体为空，不返回 `Result` 结构。

    BadRequest:
      description: 请求参数不合法（请求体格式错误、参数类型不匹配、上传文件过大等），返回 HTTP 400。
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Result'

  schemas:

    # ---------- 通用 ----------

    Result:
      type: object
      description: 统一响应结构。业务失败同样返回 HTTP 200，由 `code` 区分。
      properties:
        code:
          type: integer
          description: 1:成功, 0:失败
          enum: [1, 0]
        msg:
          type: string
          description: 提示信息，成功时固定为 `success`
        data:
          description: 业务数据，无数据时为 `null`
      required: [code, msg]

    DateTime:
      type: string
      description: 时间，输出格式 `yyyy-MM-dd HH:mm:ss`
      example: '2025-06-01 00:00:00'

    # ---------- 枚举 ----------

    Channel:
      type: integer
      format: int32
      description: 渠道来源，1:线上活动, 2:推广介绍
      enum: [1, 2]

    Subject:
      type: integer
      format: int32
      description: 意向学科，1:AI智能应用开发(Java), 2:AI大模型开发(Python), 3:AI鸿蒙开发, 4:AI大数据, 5:AI嵌入式, 6:AI测试, 7:AI运维
      enum: [1, 2, 3, 4, 5, 6, 7]

    Gender:
      type: integer
      format: int32
      description: 性别，1:男, 2:女
      enum: [1, 2]

    Degree:
      type: integer
      format: int32
      description: 学历，1:高中, 2:中专, 3:大专, 4:本科, 5:硕士, 6:博士, 7:其他
      enum: [1, 2, 3, 4, 5, 6, 7]

    JobStatus:
      type: integer
      format: int32
      description: 在职情况，1:在职, 0:离职
      enum: [0, 1]

    ClueStatus:
      type: integer
      format: int32
      description: 线索状态，1:待分配, 2:待跟进, 3:跟进中, 4:伪线索, 5:转为商机
      enum: [1, 2, 3, 4, 5]

    ClueLevel:
      type: integer
      format: int32
      description: 意向等级，1:近期学习, 2:打算学习(考虑中), 3:进行了解, 4:打酱油
      enum: [1, 2, 3, 4]

    ClueTrackType:
      type: integer
      format: int32
      description: 跟进类型，1:正常跟进, 0:伪线索
      enum: [0, 1]

    FalseReason:
      type: integer
      format: int32
      description: 伪线索原因，1:空号, 2:停机, 3:竞品, 4:无法联系, 5:其他
      enum: [1, 2, 3, 4, 5]

    BusinessStatus:
      type: integer
      format: int32
      description: 商机状态，1:待分配, 2:待跟进, 3:跟进中, 4:回收, 5:转客户
      enum: [1, 2, 3, 4, 5]

    BusinessTrackStatus:
      type: integer
      format: int32
      description: 跟进状态，1:接通, 2:拒绝, 3:无人接听
      enum: [1, 2, 3]

    ActivityType:
      type: integer
      format: int32
      description: 活动类型，1:课程折扣, 2:代金券
      enum: [1, 2]

    ActivityStatus:
      type: integer
      format: int32
      description: |
        活动状态（查询条件，不落库，由 `startTime` / `endTime` 与当前时间比较得出）：
        1 未开始（startTime > now）、2 进行中（startTime <= now <= endTime）、3 已结束（endTime < now）
      enum: [1, 2, 3]

    CourseTarget:
      type: integer
      format: int32
      description: 适用人群，1:小白学员, 2:中级程序员, 3:初级程序员（页面原型比接口文档多出「初级程序员」一档，故放开为 1~3 的超集）
      enum: [1, 2, 3]

    EnableStatus:
      type: integer
      format: int32
      description: 状态，1:正常, 0:停用
      enum: [0, 1]

    # ---------- 认证 ----------

    LoginDto:
      type: object
      properties:
        username:
          type: string
          description: 用户名
        password:
          type: string
          description: 明文密码
      required: [username, password]

    LoginResultVO:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 用户ID
        username:
          type: string
          description: 用户名
        name:
          type: string
          description: 姓名
        image:
          type: [string, 'null']
          description: 头像访问路径
        roleLabel:
          type: [string, 'null']
          description: 角色标识，前端据此控制菜单与按钮权限
        token:
          type: string
          description: JWT 令牌，后续请求需放入请求头 `token`

    # ---------- 用户 ----------

    UserVO:
      type: object
      description: 用户视图对象，不含密码字段
      properties:
        id: { type: integer, format: int64, description: 用户ID }
        username: { type: string, description: 用户名 }
        name: { type: string, description: 姓名 }
        phone: { type: string, description: 手机号 }
        email: { type: string, description: 邮箱 }
        gender: { $ref: '#/components/schemas/Gender' }
        status: { $ref: '#/components/schemas/EnableStatus' }
        deptId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 部门ID
        roleId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 角色ID
        image:
          type: [string, 'null']
          description: 头像访问路径
        remark:
          type: [string, 'null']
          description: 备注
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }
        deptName:
          type: [string, 'null']
          description: 部门名称，由部门表关联查询得到
        roleName:
          type: [string, 'null']
          description: 角色名称，由角色表关联查询得到

    UserBody:
      type: object
      description: 新增或修改用户的请求体
      properties:
        id:
          type: integer
          format: int64
          description: 用户ID，修改时必填
        username: { type: string, description: 用户名，唯一 }
        password:
          type: string
          description: |
            明文密码。新增时留空则使用默认密码 `123`，否则按 `md5(用户名 + 明文密码)` 存储；
            修改时该字段被服务端忽略。
        name: { type: string, description: 姓名 }
        phone: { type: string, description: 手机号，唯一 }
        email: { type: string, description: 邮箱，唯一 }
        gender: { $ref: '#/components/schemas/Gender' }
        status: { $ref: '#/components/schemas/EnableStatus' }
        deptId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 部门ID
        roleId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 角色ID
        image:
          type: [string, 'null']
          description: 头像访问路径
        remark:
          type: [string, 'null']
          description: 备注
      required: [username, name, phone, email, gender, status]

    # ---------- 部门 ----------

    DeptVO:
      type: object
      properties:
        id: { type: integer, format: int64, description: 部门ID }
        name: { type: string, description: 部门名称，唯一 }
        status: { $ref: '#/components/schemas/EnableStatus' }
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }

    DeptBody:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 部门ID，修改时必填
        name: { type: string, description: 部门名称，唯一 }
        status: { $ref: '#/components/schemas/EnableStatus' }
      required: [name, status]

    # ---------- 角色 ----------

    RoleVO:
      type: object
      properties:
        id: { type: integer, format: int64, description: 角色ID }
        name: { type: string, description: 角色名称 }
        label: { type: string, description: 角色标识，全局唯一，权限判断用 }
        remark:
          type: [string, 'null']
          description: 备注说明
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }

    RoleBody:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 角色ID，修改时必填
        name: { type: string, description: 角色名称 }
        label: { type: string, description: 角色标识，全局唯一 }
        remark:
          type: [string, 'null']
          description: 备注说明
      required: [name, label]

    # ---------- 课程 ----------

    CourseVO:
      type: object
      properties:
        id: { type: integer, format: int64, description: 课程ID }
        subject: { $ref: '#/components/schemas/Subject' }
        name: { type: string, description: 课程名称 }
        price: { type: integer, format: int32, description: 价格，单位：元 }
        target: { $ref: '#/components/schemas/CourseTarget' }
        description:
          type: [string, 'null']
          description: 课程介绍
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }

    CourseBody:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 课程ID，修改时必填
        subject: { $ref: '#/components/schemas/Subject' }
        name: { type: string, description: 课程名称 }
        price: { type: integer, format: int32, description: 价格，单位：元 }
        target: { $ref: '#/components/schemas/CourseTarget' }
        description:
          type: [string, 'null']
          description: 课程介绍
      required: [subject, name, price, target]

    # ---------- 活动 ----------

    ActivityVO:
      type: object
      properties:
        id: { type: integer, format: int64, description: 活动ID }
        channel: { $ref: '#/components/schemas/Channel' }
        name: { type: string, description: 活动名称 }
        startTime: { $ref: '#/components/schemas/DateTime' }
        endTime: { $ref: '#/components/schemas/DateTime' }
        description:
          type: [string, 'null']
          description: 活动简介
        type: { $ref: '#/components/schemas/ActivityType' }
        discount:
          anyOf:
            - type: number
            - type: 'null'
          description: 课程折扣，例如 `8.0` 表示 8 折。与 `voucher` 二选一
          example: 8.0
        voucher:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 课程代金券，单位：元。与 `discount` 二选一
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }

    ActivityBody:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: 活动ID，修改时必填
        channel: { $ref: '#/components/schemas/Channel' }
        name: { type: string, description: 活动名称 }
        startTime: { $ref: '#/components/schemas/DateTime' }
        endTime: { $ref: '#/components/schemas/DateTime' }
        description:
          type: [string, 'null']
          description: 活动简介
        type: { $ref: '#/components/schemas/ActivityType' }
        discount:
          anyOf:
            - type: number
            - type: 'null'
          description: 课程折扣。`type = 1` 时填写
        voucher:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 课程代金券，单位：元。`type = 2` 时填写
      required: [channel, name, startTime, endTime, type]

    # ---------- 线索 ----------

    Clue:
      type: object
      properties:
        id: { type: integer, format: int64, description: 线索ID }
        phone: { type: string, description: 手机号，唯一 }
        channel: { $ref: '#/components/schemas/Channel' }
        activityId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 关联活动的ID
        name:
          type: [string, 'null']
          description: 客户姓名
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        age:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 年龄
        wechat:
          type: [string, 'null']
          description: 微信号
        qq:
          type: [string, 'null']
          description: QQ号
        userId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 归属人ID
        status: { $ref: '#/components/schemas/ClueStatus' }
        subject:
          anyOf:
            - $ref: '#/components/schemas/Subject'
            - type: 'null'
        level:
          anyOf:
            - $ref: '#/components/schemas/ClueLevel'
            - type: 'null'
        nextTime:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
          description: 下次跟进时间
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }
        assignName:
          type: [string, 'null']
          description: 归属人姓名，由用户表关联查询得到
        activityName:
          type: [string, 'null']
          description: 活动名称，线索池查询时由活动表关联得到
        trackRecords:
          anyOf:
            - type: array
              items: { $ref: '#/components/schemas/ClueTrackRecord' }
            - type: 'null'
          description: 跟进记录列表，仅线索详情接口返回
        record:
          type: [string, 'null']
          description: 本次跟进内容，仅用于接收 `PUT /clues` 的请求参数，查询接口中为 `null`

    ClueTrackRecord:
      type: object
      description: 线索跟进记录
      properties:
        id: { type: integer, format: int64, description: 跟进记录ID }
        clueId: { type: integer, format: int64, description: 线索ID }
        userId: { type: integer, format: int64, description: 跟进人ID }
        subject:
          anyOf:
            - $ref: '#/components/schemas/Subject'
            - type: 'null'
        level:
          anyOf:
            - $ref: '#/components/schemas/ClueLevel'
            - type: 'null'
        record:
          type: [string, 'null']
          description: 跟进记录内容
        nextTime:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        type: { $ref: '#/components/schemas/ClueTrackType' }
        falseReason:
          anyOf:
            - $ref: '#/components/schemas/FalseReason'
            - type: 'null'
          description: 伪线索原因，`type = 0` 时有值
        createTime: { $ref: '#/components/schemas/DateTime' }
        assignName:
          type: [string, 'null']
          description: 跟进人姓名

    ClueBody:
      type: object
      description: 新增线索的请求体，`status` 与 `userId` 由服务端强制设置，传入不生效
      properties:
        phone: { type: string, description: 手机号，唯一 }
        channel: { $ref: '#/components/schemas/Channel' }
        activityId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 关联活动的ID
        name:
          type: [string, 'null']
          description: 客户姓名
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        age:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 年龄
        wechat:
          type: [string, 'null']
          description: 微信号
        qq:
          type: [string, 'null']
          description: QQ号
        subject:
          anyOf:
            - $ref: '#/components/schemas/Subject'
            - type: 'null'
        level:
          anyOf:
            - $ref: '#/components/schemas/ClueLevel'
            - type: 'null'
        nextTime:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
      required: [phone, channel]

    ClueTrackBody:
      type: object
      description: 跟进线索的请求体，未传字段保持原值
      properties:
        id: { type: integer, format: int64, description: 线索ID }
        name:
          type: [string, 'null']
          description: 客户姓名
        phone:
          type: [string, 'null']
          description: 手机号
        channel:
          anyOf:
            - $ref: '#/components/schemas/Channel'
            - type: 'null'
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        age:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 年龄
        wechat:
          type: [string, 'null']
          description: 微信号
        qq:
          type: [string, 'null']
          description: QQ号
        subject:
          anyOf:
            - $ref: '#/components/schemas/Subject'
            - type: 'null'
        level:
          anyOf:
            - $ref: '#/components/schemas/ClueLevel'
            - type: 'null'
        nextTime:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
        record:
          type: [string, 'null']
          description: 本次跟进内容，写入跟进记录
      required: [id]

    MarkFalseClueBody:
      type: object
      properties:
        reason: { $ref: '#/components/schemas/FalseReason' }
        remark:
          type: [string, 'null']
          description: 备注信息，写入跟进记录的 `record`
      required: [reason]

    # ---------- 商机 ----------

    Business:
      type: object
      properties:
        id: { type: integer, format: int64, description: 商机ID }
        name:
          type: [string, 'null']
          description: 客户姓名
        phone: { type: string, description: 手机号，唯一 }
        gender:
          anyOf:
            - $ref: '#/components/schemas/Gender'
            - type: 'null'
        age:
          anyOf:
            - type: integer
              format: int32
            - type: 'null'
          description: 年龄
        wechat:
          type: [string, 'null']
          description: 微信号
        qq:
          type: [string, 'null']
          description: QQ号
        subject:
          anyOf:
            - $ref: '#/components/schemas/Subject'
            - type: 'null'
        courseId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 意向课程ID
        degree:
          anyOf:
            - $ref: '#/components/schemas/Degree'
            - type: 'null'
        jobStatus:
          anyOf:
            - $ref: '#/components/schemas/JobStatus'
            - type: 'null'
        channel: { $ref: '#/components/schemas/Channel' }
        remark:
          type: [string, 'null']
          description: 备注
        status: { $ref: '#/components/schemas/BusinessStatus' }
        userId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 归属人ID
        clueId:
          anyOf:
            - type: integer
              format: int64
            - type: 'null'
          description: 来源线索ID
        nextTime:
          anyOf:
            - $ref: '#/components/schemas/DateTime'
            - type: 'null'
          description: 下次跟进时间
        createTime: { $ref: '#/components/schemas/DateTime' }
        updateTime: { $ref: '#/components/schemas/DateTime' }
        assignName:
          type: [string, 'null']
          description: 归属人姓名
        courseName:
          type: [string, 'null']
          description: 意向课程名称，仅商机详情接口返回
        trackRecords:
          anyOf:
            - type: array
              items: { $ref: '#/components/schemas/BusinessTrackRecord' }
            - type: 'null'
          description: 跟进记录列表，仅商机详情接口返回
        trackStatus:
          anyOf:
            - $ref: '#/components/schemas/BusinessTrackStatus'
            - type: 'null'
          description: 本次跟进状态，仅用于接收 `PUT /businesses` 的请求参数，查询接口中为 `null`
        keyItems:
