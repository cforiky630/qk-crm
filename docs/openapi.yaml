      description: 该接口会写入一条操作日志。
      operationId: deleteActivity
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /clues:
    get:
      tags: [线索管理]
      summary: 线索列表查询
      description: |
        默认只返回仍在跟进的线索：`status` 为 `4 伪线索` 与 `5 转为商机` 的线索不出现在此列表。
        显式传 `status` 时按其取值筛选（前端状态下拉里包含这两个状态，选中后应能看到对应数据）。
        按修改时间倒序。
      operationId: listClues
      parameters:
        - name: clueId
          in: query
          description: 线索ID，精确匹配
          schema: { type: integer, format: int64 }
        - name: phone
          in: query
          description: 手机号，模糊匹配
          schema: { type: string }
        - name: status
          in: query
          description: 线索状态；不传时排除 4 伪线索、5 转为商机
          schema: { $ref: '#/components/schemas/ClueStatus' }
        - name: channel
          in: query
          description: 线索来源
          schema: { $ref: '#/components/schemas/Channel' }
        - name: assignName
          in: query
          description: 归属人姓名，模糊匹配
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，`rows` 中 `trackRecords` 与 `record` 为 `null`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCluePage'
    post:
      tags: [线索管理]
      summary: 新增线索
      description: |
        新增的线索一律置为 `1 待分配` 且归属人清空，请求体中的 `status`、`userId` 不生效。
        手机号唯一，重复时返回 `msg = 该手机号已录入线索`。该接口会写入一条操作日志。
      operationId: addClue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClueBody'
            example:
              phone: '15100000001'
              channel: 1
              name: 卫丹
              gender: 2
              age: 24
              wechat: wxweidan
              qq: '8450313640'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'
    put:
      tags: [线索管理]
      summary: 跟进线索
      description: |
        将线索状态置为 `3 跟进中`，并新增一条 `type = 1` 的正常跟进记录。
        请求体中除 `id` 外的字段为可选，未传字段保持原值；`record` 为本次跟进内容，写入跟进记录。
        该接口会写入一条操作日志。
      operationId: trackClue
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClueTrackBody'
            example:
              id: 55
              subject: 1
              level: 3
              nextTime: '2025-05-22 12:00:00'
              record: 了解一下目前 java 方向的就业前景
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /clues/pool:
    get:
      tags: [线索管理]
      summary: 线索池列表查询
      description: 只返回伪线索（`status = 4`），供管理员重新分配；并关联带出活动名称。按修改时间倒序。
      operationId: listPoolClues
      parameters:
        - name: clueId
          in: query
          description: 线索ID，精确匹配
          schema: { type: integer, format: int64 }
        - name: phone
          in: query
          description: 手机号，模糊匹配
          schema: { type: string }
        - name: channel
          in: query
          description: 线索来源
          schema: { $ref: '#/components/schemas/Channel' }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 分页结果，`rows` 中 `activityName` 为活动名称
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCluePage'

  /clues/assign/{clueId}/{userId}:
    put:
      tags: [线索管理]
      summary: 分配线索给指定用户
      description: 将线索归属人设为指定用户并置为 `2 待跟进`。该接口会写入一条操作日志。
      operationId: assignClue
      parameters:
        - name: clueId
          in: path
          required: true
          description: 线索ID
          schema: { type: integer, format: int64 }
        - name: userId
          in: path
          required: true
          description: 被分配的用户ID
          schema: { type: integer, format: int64 }
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /clues/false/{id}:
    put:
      tags: [线索管理]
      summary: 将线索标记为伪线索
      description: |
        将线索置为 `4 伪线索`，并新增一条 `type = 0` 的跟进记录，记录伪线索原因与备注。
        该接口会写入一条操作日志。
      operationId: markFalseClue
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MarkFalseClueBody'
            example:
              reason: 2
              remark: 电话停机了
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /clues/toBusiness/{id}:
    put:
      tags: [线索管理]
      summary: 将线索转为商机
      description: |
        将线索置为 `5 转为商机`，并按线索信息复制生成一条商机：
        商机重新走分配流程，因此归属人与下次跟进时间被清空，状态为 `1 待分配`，同时记录来源线索ID。
        该接口会写入一条操作日志。
      operationId: convertClueToBusiness
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          $ref: '#/components/responses/Ok'

  /clues/{id}:
    get:
      tags: [线索管理]
