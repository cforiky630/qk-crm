      tags: [操作日志]
      summary: 操作日志列表查询
      description: |
        日志由切面在增删改接口执行成功后自动写入，带出操作人姓名，
        并按类名/方法名映射出业务化的 `operateModule`（操作模块）与 `operateType`（操作类型）。
        查询类接口（GET）当前不写日志，因此「查询XX」这类记录不会出现。
        按操作时间倒序。
      operationId: listLogs
      parameters:
        - name: operateUserName
          in: query
          description: 操作人姓名，模糊匹配
          schema: { type: string }
        - name: operateModule
          in: query
          description: 操作模块，模糊匹配（如「部门管理」「用户」，由类名映射，见 OperateLogVO.operateModule）
          schema: { type: string }
        - name: operateType
          in: query
          description: 操作类型，模糊匹配（如「新增部门」「删除」，由类名+方法名映射，见 OperateLogVO.operateType）
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
