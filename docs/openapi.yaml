          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultActivityList'

  /activities/{id}:
    get:
      tags: [活动管理]
      summary: 根据ID查询活动
      operationId: getActivityById
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 活动信息；不存在时 `code = 0`、`msg = 活动不存在`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultActivity'
    delete:
      tags: [活动管理]
